name: 'Checksum AI Test Run'
description: 'Trigger a Checksum AI test run from CI, optionally with auto-heal.'
author: 'Checksum AI'

branding:
  icon: 'play-circle'
  color: 'blue'

inputs:
  api-key:
    description: 'Checksum AI API key. Pass via a secret (see README for an example).'
    required: true

  # Execution mode — set exactly one of the following (or `affected`).
  affected:
    description: 'Resolve affected tests via POST /public-api/v1/affected-tests, then dispatch grep execution with the returned test ids. Changed files come from `changed-files`, or a `git-base-ref` diff, or — when neither is set — the PR''s files read from the GitHub API (no checkout needed; pair with `env-overrides` to target a preview).'
    required: false
    default: 'false'
  changed-files:
    description: 'Changed source paths (one per line) for `affected` mode. Ignored when `git-base-ref` computes the diff.'
    required: false
  git-base-ref:
    description: 'Git ref to diff against (e.g. origin/main) when `affected` is true. Requires a prior checkout with fetch-depth: 0. Omit (with no `changed-files`) to auto-read the PR''s files from the GitHub API instead.'
    required: false
  git-dir:
    description: 'Optional path passed as `git -C` when computing the diff (dual-repo CI: monorepo checkout while the workflow runs elsewhere).'
    required: false
  grep:
    description: 'Substring or regex pattern matched against test names.'
    required: false
  suite-ids:
    description: 'Comma-separated list of test suite UUIDs.'
    required: false
  test-ids:
    description: 'Comma-separated list of test UUIDs.'
    required: false
  collection-id:
    description: 'A single test collection UUID.'
    required: false

  # Sharding — fan a run out across parallel pods. Additive: omit (or 1) for the
  # existing single-pod behavior. A sharded run (shard-count >= 2) has a `null`
  # `name`, so when `wait` is true it is polled by run id via
  # GET /public-api/v1/execution/status/run/{runId} and gates on the
  # server-computed verdict. Sharding is incompatible with auto-heal.
  shard-count:
    description: 'Number of parallel shards (1–20). 1 (or omitted) runs single-pod; 2–20 fans the selection out across that many pods and merges the reports into one run. For PR-scoped runs use `grep` (the v2 grep endpoint carries `branch` + `env-overrides`).'
    required: false
  workers:
    description: 'Playwright workers per shard (1–8). Only meaningful when `shard-count` >= 2; ignored otherwise.'
    required: false

  # Optional execution-time pass-throughs (grep mode only — backend constraint).
  branch:
    description: 'Branch of the TEST repository to check out for this run. Defaults to the test repo''s default branch when omitted. Only honored in grep mode.'
    required: false
  env-overrides:
    description: 'JSON object of per-run environment variable overrides, e.g. ''{"BASE_URL":"https://pr-123.preview.example.com"}''. Only honored in grep mode.'
    required: false

  # Auto-heal options.
  auto-heal:
    description: 'Enable auto-heal-on-failure. When true, failing tests will trigger a healing pipeline and (by default) push fixes as a PR.'
    required: false
    default: 'false'
  auto-create-pr:
    description: 'When auto-heal is enabled, push healed tests as a PR. Defaults to true.'
    required: false
    default: 'true'
  pr-number:
    description: 'Source PR number for auto-heal progress comments. Auto-detected from the workflow event when running on pull_request / pull_request_target.'
    required: false
  repo-name:
    description: 'Source repository name (just the bare repo, no owner). Auto-detected from github.repository when omitted.'
    required: false
  metadata:
    description: 'JSON object of free-form metadata attached to each healing session, useful for tracing or correlation IDs.'
    required: false

  # Wait-for-completion. When false (default) the action exits 0 as soon as
  # the dispatch is accepted (15s typical) and lets the asynchronous PR-comment
  # pipeline notify the user. When true, the action polls the status endpoint
  # until the run terminates and exits with code 0 on `passed`/`healed` or
  # 1 on `failed`/`process-error`/`cancelled`/timeout.
  wait:
    description: 'Poll the status endpoint until the run reaches a terminal status. When true the action exit code reflects the test outcome.'
    required: false
    default: 'false'
  poll-interval-seconds:
    description: 'How often to poll status when `wait` is true.'
    required: false
    default: '15'
  wait-timeout-seconds:
    description: 'Maximum time to wait for the run to terminate when `wait` is true. When omitted the action waits indefinitely; the workflow job''s `timeout-minutes` is the upper bound.'
    required: false

  # Plumbing.
  api-base-url:
    description: 'Checksum AI API base URL.'
    required: false
    default: 'https://api.checksum.ai'
  github-token:
    description: 'Token used to look up the open PR for the current branch when running on a `push` event (so `pr-number` can be auto-resolved). Defaults to the workflow''s GITHUB_TOKEN. Needs `pull-requests: read` permission. Ignored on `pull_request` events (the PR number is read from the event payload).'
    required: false
    default: ${{ github.token }}

outputs:
  affected-test-ids:
    description: 'JSON array of Checksum test ids from /affected-tests when `affected` is true. Empty when nothing was affected.'
  grep-pattern:
    description: 'Grep pattern derived from affected test ids and sent to /execution/grep. Set only when `affected` found tests to run.'
  job-name:
    description: 'K8s job name of the dispatched run, returned by the execution endpoint for a single-pod run. Use it to query status via /public-api/v2/execution/status/{jobName}. Empty for a sharded run (poll by `run-id` instead).'
  run-id:
    description: 'Stable run id returned by every execution endpoint. For a sharded run this is the only poll handle (the job `name` is null); query status via /public-api/v1/execution/status/run/{runId}.'
  status:
    description: 'Final status when `wait` is true. For single-pod: passed / healed / failed / process-error / cancelled / timeout. For sharded: the run phase (complete / failed) or `timeout`. Empty when `wait` is false.'
  verdict:
    description: 'Server-computed pass/fail gate for a sharded run when `wait` is true (`pass` / `fail` / `timeout`). Empty for single-pod runs (use `status`).'
  test-run-id:
    description: 'Test run UUID, populated when `wait` is true and the run reaches a terminal status.'

runs:
  using: 'node20'
  main: 'dist/index.js'
